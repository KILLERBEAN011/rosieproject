<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You, With Love ❤️</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container" id="welcome-container">
        <div class="card welcome-card">
            <h1>I have a surprise for you...</h1>
            <p>Are you ready to see it?</p>
            <button id="reveal-button">Click to Reveal 💌</button>
        </div>
    </div>

    <div class="container hidden" id="message-container">
        <div class="card">
            <div class="heart-icon">💖</div>
            <h1>Good Morning, Beautiful!</h1>
            <p class="message">
                I just wanted to wish you a very good day today.<br>
                Please always remember to smile, because your smile lights up my world.<br><br>
                Never forget that <strong>Ajibola loves you thoroughly and completely.</strong>
            </p>
            <div class="signature">- Yours forever, Ajibola ❤️</div>
        </div>
    </div>

    <!-- Container for floating hearts -->
    <div id="hearts-container"></div>

    <script src="script.js"></script>
</body>
</html>
